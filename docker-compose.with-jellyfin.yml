# Full mobile-server stack: Jellyfin (linuxserver.io) + Jellybrary together.
# Use this when the travel box (truck/RV/laptop) doesn't run Jellyfin yet.
# Already have Jellyfin installed? Use docker-compose.yml instead.
#
# First run:
#   1. docker compose -f docker-compose.with-jellyfin.yml up -d
#   2. http://<host>:8096  → Jellyfin setup wizard; add libraries:
#        Movies → /media/movies        Shows → /media/shows
#      then Dashboard → API Keys → create one for Jellybrary
#   3. http://<host>:3131  → Jellybrary Settings:
#        mobile server URL:  http://jellyfin:8096   (container-to-container)
#        library paths:      /media/movies and /media/shows
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "8096:8096"
    # Got an Intel/AMD iGPU on the mobile box? Pass it through for hardware
    # transcoding during local playback:
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - ./jellyfin-config:/config
      - ./media:/media

  jellybrary:
    build: .
    image: jellybrary:latest
    container_name: jellybrary
    restart: unless-stopped
    depends_on:
      - jellyfin
    ports:
      - "3131:3131"
    volumes:
      - ./data:/data
      # Same host folder as Jellyfin's /media, same container path — the library
      # paths you set in Jellybrary are then valid for both containers.
      - ./media:/media
