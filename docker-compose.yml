# Runs on the MOBILE server (truck/RV) alongside its Jellyfin.
services:
  jellybrary:
    build: .
    image: jellybrary:latest
    container_name: jellybrary
    restart: unless-stopped
    ports:
      - "3131:3131"
    volumes:
      - ./data:/data
      # Milestone 2: mount the mobile Jellyfin's library so checkouts land in it, e.g.
      # - /path/to/jellyfin/media:/media
