# Jellybrary only — for a mobile machine that ALREADY runs Jellyfin locally.
# No Jellyfin yet? Use docker-compose.with-jellyfin.yml for the full stack.
services:
  jellybrary:
    build: .
    image: jellybrary:latest
    container_name: jellybrary
    restart: unless-stopped
    ports:
      - "3131:3131"
    volumes:
      - ./data:/data
      # Mount the mobile Jellyfin's library so checkouts land in it, then set the
      # Settings → Library paths to the container-side paths (e.g. /media/movies):
      # - /path/to/jellyfin/media:/media
